services:
  max-api:
    build: .
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${BIND_HOST:-127.0.0.1}:8087:8087"
    environment:
      API_KEY: ${API_KEY:?Run python3 setup.py first}
      DATA_DIR: /data
    volumes:
      - max-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8087/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  wiki:
    build: ./wiki
    restart: unless-stopped
    ports:
      - "${WIKI_BIND_HOST:-127.0.0.1}:8088:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  max-data:
